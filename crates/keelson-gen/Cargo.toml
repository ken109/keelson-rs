[package]
name = "keelson-gen"
description = "keelson's code generator: introspect a live schema, emit readable model .rs files against keelson-models."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# The live-introspection parity tests: introspect the shared schema from the
# containerised PostgreSQL 17 (via keelson-sqlcheck's containers and the
# `KEELSON_LIVE_*_URL` overrides) and assert the result equals the hand-built
# IR the offline tests emit from:
#
#   cargo test -p keelson-gen --features live-docker
live-docker = ["keelson-sqlcheck/live-docker", "keelson-sqlx/psql"]

[dependencies]
# The emission pipeline: TokenStreams built with quote, parsed into a
# syn::File, formatted with prettyplease — one formatter, so output is
# byte-deterministic without depending on the user's rustfmt.
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
prettyplease.workspace = true

# Configuration (TOML in, serde structs out).
serde.workspace = true
toml.workspace = true

# Introspection drivers — the direct-catalog decision (see src/lib.rs docs):
# rusqlite for sqlite_master/pragma, postgres for pg_catalog. Both are already
# in the workspace for keelson-sqlcheck's live judges; sea-schema was
# evaluated and rejected (the evaluation is in the crate docs).
rusqlite.workspace = true
postgres.workspace = true

[dev-dependencies]
# What the *generated* code needs to compile and run: the checked-in
# generated fixtures under tests/generated/ are compiled as test modules and
# executed against real SQLite, exactly as an application's models crate
# would depend on these.
keelson-core = { workspace = true, features = ["chrono"] }
keelson-exec.workspace = true
keelson-models.workspace = true
keelson-psql.workspace = true
keelson-sqlite.workspace = true
keelson-sqlx = { workspace = true, features = ["sqlite", "chrono"] }
keelson-sqlcheck.workspace = true
chrono.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The compile_fail proof that a non-binding type override is a compile error
# at the named assert_bind line.
trybuild.workspace = true
rusqlite.workspace = true

[lints]
workspace = true
