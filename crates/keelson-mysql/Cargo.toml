[package]
name = "keelson-mysql"
description = "The MySQL dialect for keelson."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["sql", "mysql", "mariadb", "query-builder", "database"]
categories = ["database"]

[features]
# `sql!` — a hand-written statement whose values are written at the hole they
# bind to. Off by default, like every other feature here: it is the only thing
# in this crate that costs a proc-macro toolchain, and `raw_query` is the same
# statement without one.
macros = ["keelson-core/macros"]
# Adds the containerised MySQL 8.4 engine to the test judge. `cargo test` on its
# own runs only the `sqlparser` grammar tier, which for MySQL is advisory: it
# accepts PostgreSQL-only syntax and rejects valid multi-table `UPDATE a, b SET`.
# The server is the only trustworthy judge for this dialect, so run it.
live-docker = ["keelson-sqlcheck/live-docker"]
# Widens the combinatorial suite (`tests/combinatorial.rs`) from one representative
# variant per clause to every variant — join kinds, compound operators, lock
# spellings. The clause-by-clause cross product always runs; this multiplies it.
exhaustive = []

[dependencies]
keelson-core.workspace = true

[dev-dependencies]
keelson-sqlcheck = { path = "../keelson-sqlcheck", features = ["live", "property"] }
proptest.workspace = true

[package.metadata.docs.rs]
# `sql!` is behind `macros`, so without this the docs.rs page for this crate
# omits the one item the README leads with. `live-docker`/`exhaustive` are test
# tiers, not surface, and are left off.
features = ["macros"]

[lints]
workspace = true
