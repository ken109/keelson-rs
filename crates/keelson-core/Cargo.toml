[package]
name = "keelson-core"
description = "Core primitives for keelson: Value, Expression, SqlWriter, Dialect and Mod."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["sql", "query-builder", "database", "postgres", "sqlite"]
categories = ["database"]

[features]
# Exposes `keelson_core::testing`, the stand-in dialects. Dialect crates enable it
# as a dev-dependency feature; it is never on in a normal build.
testing = []
# Adds the containerised PostgreSQL engine to the judge, the same way the dialect
# crates do it. `cargo test` on its own already runs the libpg_query grammar tier
# through keelson-sqlcheck; this is what makes a real server answer as well.
#
#   cargo test -p keelson-core --features live-docker
#
# Workspace-wide, name the judge's feature instead — or as well:
#
#   cargo test --workspace --features keelson-sqlcheck/live-docker
#
# because this crate's dependency on keelson-sqlcheck is a dev-dependency cycle,
# and a feature cannot propagate around one when keelson-sqlcheck is also being
# built as a package in its own right: it ends up with `live-docker` switched on
# and the optional dependencies it implies switched off, and does not compile.
live-docker = ["keelson-sqlcheck/live-docker"]

# First-class `Value` variants for the types nearly every application binds.
# They live here, feature-gated, rather than in a satellite crate: `Value` is an
# enum, and an enum's variants cannot be added from outside the crate that owns
# it — a separate `keelson-types` crate could only offer `CustomValue` wrappers,
# which is exactly the downcasting these variants exist to remove. Backend-only
# conversions would mean `arg(uuid)` does not compile in builder code, which is
# the ergonomic point. None of these is a default feature: the no-features build
# is byte-for-byte what it was before they existed. The type × dialect mapping
# each variant implies is recorded in docs/type-mappings.md.
chrono = ["dep:chrono"]
uuid = ["dep:uuid"]
decimal = ["dep:rust_decimal"]
json = ["dep:serde_json"]

# The derive macros — `#[derive(Bind)]` for newtype column overrides and
# `#[derive(FromRow)]` for row mapping. They are re-exported from here, not
# from keelson-exec, so that `keelson_core::Bind` (the derive) sits next to the
# `ToValue`/`FromValue` pair it writes; `FromRow`'s trait still lives in
# keelson-exec, which anything using that derive already depends on. Off by
# default: without it this crate pulls in no proc-macro toolchain at all.
macros = ["dep:keelson-macros"]

[dependencies]
keelson-macros = { workspace = true, optional = true }
# `Value` serialises as a bare scalar so a built argument list can be compared,
# logged or shipped as plain JSON. That is the only reason serde is here.
serde.workspace = true
chrono = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
rust_decimal = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
# A dev-dependency on itself is how an integration test reaches a feature-gated
# item: `tests/*.rs` is a separate crate, so `#[cfg(test)]` does not cover it and
# `dialect::testing` would otherwise be invisible to `tests/grammar_raw.rs`.
keelson-core = { path = ".", features = ["testing"] }
# The judge. `testing` brings the stand-in dialect that makes rendering possible
# here at all; without it there would be nothing to hand to the grammar. This is a
# cycle — keelson-sqlcheck depends on keelson-core — but only through a
# dev-dependency, which is the kind Cargo resolves.
keelson-sqlcheck = { path = "../keelson-sqlcheck", features = ["live", "testing"] }
serde_json.workspace = true

[package.metadata.docs.rs]
# The mapped-type variants and the derives are part of the documented surface;
# `testing` (stand-in dialects) and `live-docker` (a dev-dependency's engine
# tier) are not, and are left off.
features = ["chrono", "uuid", "decimal", "json", "macros"]

[lints]
workspace = true
