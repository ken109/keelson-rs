[package]
name = "keelson-models"
description = "keelson's typed model layer: the View/Table traits, Setter plumbing, hooks and relation loaders the code generator emits against."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["sql", "orm", "database", "models", "codegen"]
categories = ["database"]

[features]
# The hand-written models' end-to-end tests against containerised
# PostgreSQL 17 and MySQL 8.4, reusing keelson-sqlcheck's containers and
# `KEELSON_LIVE_*_URL` overrides (the SQLite lane needs no feature and runs in
# every plain `cargo test`):
#
#   cargo test -p keelson-models --features live-docker
live-docker = [
    "keelson-sqlcheck/live-docker",
    "keelson-sqlx/psql",
    "keelson-sqlx/mysql",
]

[dependencies]
# Machinery only: the model layer is dialect-generic (it is written against
# keelson-core's `Has*` clause traits) and driver-free (it executes through
# keelson-exec's `&dyn Executor`). The dialect and backend crates below are
# dev-dependencies — they belong to the hand-written example model, exactly as
# they will belong to an application's own Cargo.toml once the generator emits
# its models.
keelson-core.workspace = true
keelson-exec.workspace = true

[dev-dependencies]
# The hand-written users/posts model — the code generator's specification —
# is written three times: against keelson-psql (the demonstration dialect),
# keelson-sqlite (the always-on end-to-end lane) and keelson-mysql (the
# no-RETURNING dialect, whose divergences are a different `Table` body).
keelson-core = { path = "../keelson-core", features = ["chrono"] }
keelson-mysql = { path = "../keelson-mysql" }
keelson-psql = { path = "../keelson-psql" }
keelson-sqlite = { path = "../keelson-sqlite" }
keelson-sqlx = { path = "../keelson-sqlx", features = ["sqlite", "chrono"] }
keelson-sqlcheck = { path = "../keelson-sqlcheck", features = ["live", "testing"] }
chrono.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
