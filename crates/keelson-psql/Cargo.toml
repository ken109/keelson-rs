[package]
name = "keelson-psql"
description = "The PostgreSQL dialect for keelson."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["sql", "postgres", "postgresql", "query-builder", "database"]
categories = ["database"]

[features]
# `sql!` — a hand-written statement whose values are written at the hole they
# bind to. Off by default, like every other feature here: it is the only thing
# in this crate that costs a proc-macro toolchain, and `raw_query` is the same
# statement without one.
macros = ["keelson-core/macros"]
# Adds the containerised PostgreSQL engine to the test judge. `cargo test` on its
# own already runs the libpg_query grammar tier plus real SQLite through
# keelson-sqlcheck's `live`; this is what makes the psql server itself answer.
live-docker = ["keelson-sqlcheck/live-docker"]
# The expensive tier of tests/combinatorial.rs: every co-occurrence of up to
# three clauses plus a stratified random sample, each PREPAREd against the real
# PostgreSQL container. Implies `live-docker`, because a real engine is that
# tier's judge. Plain `cargo test` still runs the grammar-tier cross product.
exhaustive = ["live-docker"]

[dependencies]
keelson-core.workspace = true

[dev-dependencies]
keelson-sqlcheck = { path = "../keelson-sqlcheck", features = ["live", "property"] }
# tests/{combinatorial,property}.rs inspect the parse tree directly (clause
# presence, and no others) — that is pg_query's protobuf, which
# keelson-sqlcheck deliberately does not re-export.
pg_query.workspace = true
proptest.workspace = true

[package.metadata.docs.rs]
# `sql!` is behind `macros`, so without this the docs.rs page for this crate
# omits the one item the README leads with. `live-docker`/`exhaustive` are test
# tiers, not surface, and are left off.
features = ["macros"]

[lints]
workspace = true
