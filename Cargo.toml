[workspace]
resolver = "3"
# `examples` is a member so the runnable examples are built and linted by the
# same `cargo clippy --workspace --all-targets` gate as the crates. It is
# `publish = false`, so `cargo package --workspace` skips it.
# `tests/facade-consumer` depends on the `keelson` facade and nothing else,
# which is the one dependency shape no other member has — and the one the
# README advertises. It is `publish = false`.
# `benches` holds the criterion benchmarks for `Query::build()`. A member of its
# own rather than a `benches/` directory inside each dialect crate, so criterion
# stays out of the published crates' dev-dependency graphs entirely — nothing a
# consumer resolves, and nothing the MSRV job has to accommodate. Also
# `publish = false`.
members = ["benches", "crates/*", "examples", "tests/facade-consumer"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/ken109/keelson-rs"
authors = ["Kensuke Kubo"]

[workspace.dependencies]
# Every published crate carries `version` beside `path`: `cargo package` refuses
# a path-only dependency, because the packaged manifest keeps the version and
# drops the path. The one exception is keelson-sqlcheck — `publish = false`, and
# used only as a dev-dependency, which cargo strips from a packaged manifest
# when (and only when) it has no version to keep.
keelson-core = { path = "crates/keelson-core", version = "0.2.0" }
keelson-exec = { path = "crates/keelson-exec", version = "0.2.0" }
keelson-factory = { path = "crates/keelson-factory", version = "0.2.0" }
keelson-gen = { path = "crates/keelson-gen", version = "0.2.0" }
keelson-macros = { path = "crates/keelson-macros", version = "0.2.0" }
keelson-models = { path = "crates/keelson-models", version = "0.2.0" }
keelson-sqlcheck = { path = "crates/keelson-sqlcheck" }
keelson-sqlx = { path = "crates/keelson-sqlx", version = "0.2.0" }
# publish = false, like keelson-sqlcheck: path-only, so nothing demands it exist
# on crates.io.
keelson-tokio-postgres = { path = "crates/keelson-tokio-postgres" }
keelson-mysql = { path = "crates/keelson-mysql", version = "0.2.0" }
keelson-psql = { path = "crates/keelson-psql", version = "0.2.0" }
keelson-sqlite = { path = "crates/keelson-sqlite", version = "0.2.0" }

pg_query = "6"
proptest = "1"
regex = "1"
mysql = "27"
postgres = "0.19"
# Held at 0.32 by the `links = "sqlite3"` rule: only one libsqlite3-sys can
# exist in the graph, sqlx 0.8's sqlite driver requires ^0.30, and rusqlite
# 0.32 is the release that shares it. The judge only uses
# open_in_memory/execute_batch/prepare, which are identical across versions.
rusqlite = { version = "0.32", features = ["bundled"] }
testcontainers = { version = "0.27", features = ["blocking"] }
testcontainers-modules = { version = "0.15", features = ["postgres", "mysql", "blocking"] }
sqlite3-parser = "0.17"
sqlparser = "0.62"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# keelson-gen's emission pipeline (build TokenStreams with quote, format with
# prettyplease) and its TOML configuration. `syn` needs `full` because
# prettyplease prints whole files, and generated bodies contain closures.
# Resolves the caller's name for a crate, so the derives can point at
# `keelson-exec` directly or at `keelson::exec` through the facade.
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing", "clone-impls", "proc-macro"] }
prettyplease = "0.2"
toml = "0.8"
trybuild = "1"

# Optional first-class Value types (keelson-core's "chrono"/"uuid"/"decimal"
# features). Default features are switched off so core does not inherit chrono's
# clock/wasm machinery or rust_decimal's serde impls — keelson serialises these
# types itself, under its own bare-scalar contract.
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid = { version = "1", default-features = false, features = ["std"] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }

# Execution layer. tokio is used by keelson-exec for its `sync` primitives only —
# no runtime assumption leaks into the traits; backends that spawn (streaming)
# add `rt` themselves. sqlx's default features are off so the first backend pulls
# in exactly the drivers and type integrations its own features name.
tokio = { version = "1", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
# keelson has no reason to reach for `unsafe`: it renders strings, binds values
# and awaits a driver. `deny` rather than `forbid` here because exactly one
# member does need it — keelson-sqlcheck's `atexit` container sweep, which is
# `publish = false` and takes a local `#[allow]` at the site with its SAFETY
# note. Every *published* crate additionally carries `#![forbid(unsafe_code)]`
# in its lib.rs, so the shipped surface cannot take that escape hatch at all.
unsafe_code = "deny"

[workspace.lints.clippy]
todo = "warn"
