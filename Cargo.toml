[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/ken109/keelson-rs"
authors = ["Kensuke Kubo"]

[workspace.dependencies]
keelson-core = { path = "crates/keelson-core" }
keelson-sqlcheck = { path = "crates/keelson-sqlcheck" }
keelson-mysql = { path = "crates/keelson-mysql" }
keelson-psql = { path = "crates/keelson-psql" }
keelson-sqlite = { path = "crates/keelson-sqlite" }

pg_query = "6"
proptest = "1"
regex = "1"
mysql = "27"
postgres = "0.19"
rusqlite = { version = "0.40", features = ["bundled"] }
testcontainers = { version = "0.27", features = ["blocking"] }
testcontainers-modules = { version = "0.15", features = ["postgres", "mysql", "blocking"] }
sqlite3-parser = "0.17"
sqlparser = "0.62"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Optional first-class Value types (keelson-core's "chrono"/"uuid"/"decimal"
# features). Default features are switched off so core does not inherit chrono's
# clock/wasm machinery or rust_decimal's serde impls — keelson serialises these
# types itself, under its own bare-scalar contract.
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid = { version = "1", default-features = false, features = ["std"] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
todo = "warn"
