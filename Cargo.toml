[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/ken109/keelson-rs"
authors = ["Kensuke Kubo"]

[workspace.dependencies]
keelson-core = { path = "crates/keelson-core" }
keelson-golden = { path = "crates/keelson-golden" }
keelson-sqlcheck = { path = "crates/keelson-sqlcheck" }
keelson-mysql = { path = "crates/keelson-mysql" }
keelson-psql = { path = "crates/keelson-psql" }
keelson-sqlite = { path = "crates/keelson-sqlite" }

pg_query = "6"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
sqlite3-parser = "0.17"
sqlparser = "0.62"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
todo = "warn"
