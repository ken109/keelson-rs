# keelson CI — the gates the repo enforces locally, wired into Actions.
#
# Everything here is runnable by hand; CONTRIBUTING.md lists the commands.
#
# Job layout (all parallel):
#   version       the workspace speaks one version, in the manifest, in every
#                 intra-workspace dependency and in the CHANGELOG. Seconds, no
#                 toolchain. It runs on ordinary pushes and not only at release
#                 time on purpose: the bump lands as a normal commit, so a
#                 half-applied one is catchable before a tag exists — which
#                 matters because crates.io uploads cannot be taken back.
#                 `release.yml` calls this same workflow and additionally passes
#                 the tag, which turns the check into "and it equals the tag".
#   fast          build + test + clippy(-D warnings) + fmt on stable, plus the
#                 examples, which assert their own output. The grammar judges and
#                 real SQLite run here already: rusqlite is bundled and
#                 pg_query/sqlite3-parser/sqlparser compile in, so a plain
#                 `cargo test` is the full non-engine verification. No services.
#   release-surface
#                 what a consumer of the published crates sees, gated the same
#                 way the code is: rustdoc with warnings denied (a broken
#                 intra-doc link only shows up on docs.rs otherwise), the
#                 `keelson` facade's whole advertised feature matrix compiled,
#                 and `cargo package` over the publishable set — which builds
#                 each crate from its own tarball and so catches a file the
#                 crate reads but does not ship. See docs/publishing.md.
#   coverage-gate records every judged SQL string during a full test run, then
#                 replays it against the checked-in construct manifests
#                 (docs/testing-tiers.md, Tier D). Runs the suite a second time
#                 because recording is env-var-gated; parallel with `fast`, so it
#                 adds no wall-clock.
#   supply-chain  `cargo deny check`: an advisory or a non-permissive licence
#                 anywhere in the tree is a thing consumers inherit, and neither
#                 is visible in `cargo build`. Seconds, no toolchain of ours.
#                 The rules and the reasoning are in deny.toml; Dependabot
#                 (.github/dependabot.yml) is what makes the tree move once a
#                 fix exists upstream.
#   coverage      `cargo llvm-cov`, reported and never gated. The construct
#                 coverage gate below proves every declared SQL construct was
#                 exercised; this answers the different question of which *Rust*
#                 lines never ran, which is where an unreachable branch or an
#                 untested error path shows up. Deliberately not a threshold: a
#                 number that fails the build is a number people write tests to
#                 move rather than tests to find bugs with.
#   msrv          `cargo check --workspace --locked` on the `rust-version`
#                 declared in Cargo.toml (read from the manifest at run time, so
#                 the job can never drift from what the workspace claims).
#                 Deliberately NOT --all-targets: rust-version is a promise to
#                 *consumers*, and test targets pull in dev-only dependencies —
#                 the test judges — whose own MSRV tracks stable (libsqlite3-sys
#                 already needs 1.95). Consumers never build those. Check-only
#                 on purpose: it proves the published surface and lockfile
#                 compile on the declared MSRV, while the behavioral gates stay
#                 on stable (which is what users build with, and where new
#                 clippy lints surface early).
#   engine        the live-docker tier: real postgres:17-alpine and mysql:8.4
#                 PREPARE every statement via testcontainers (~14 containers,
#                 several minutes). Runs on PRs and pushes to main — engine
#                 acceptance is part of this repo's definition of correct, so it
#                 must gate merges, not run after the fact. The weekly cron
#                 re-runs it (and everything else) to catch drift in the
#                 floating `postgres:17-alpine` / `mysql:8.4` image tags even
#                 when the repo is quiet. Container images are NOT cached:
#                 saving/restoring ~300 MB of docker layers through actions/cache
#                 costs about as long as pulling them fresh on GitHub's network,
#                 and a cache would defeat the point of tracking the floating
#                 tags.
#
# Toolchain pinning: stable for behavior, the manifest's `rust-version` for the
# MSRV job. Nothing pins below the MSRV.
#
# Dependency caching: Swatinem/rust-cache@v2 rather than raw actions/cache — it
# keys on toolchain + Cargo.lock + job automatically, caches the registry and
# target dir, and prunes stale artifacts so the cache stays under the size cap.
# Hand-rolling that with actions/cache is strictly more code for a worse hit
# rate.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full run (all jobs), Monday 03:17 UTC: catches floating docker-tag
    # and stable-toolchain drift while the repo is quiet.
    - cron: "17 3 * * 1"
  # `release.yml` reuses these gates rather than restating them: publishing is
  # irreversible, so it must clear at least the bar a merge does — and one
  # definition of "correct" is easier to keep true than two.
  workflow_call:
    inputs:
      expected-version:
        type: string
        default: ""
        description: "Release tag's version. When set, the version job also asserts the manifest equals it."

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # No toolchain step: the script parses the manifests and shells out to
      # `cargo metadata --locked`, which the runner's preinstalled cargo does
      # without building anything.
      - run: ./scripts/check-version-consistency.sh "${{ inputs.expected-version }}"

  fast:
    name: build / test / clippy / fmt (stable)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --all --check
      # The examples assert their own output, so running them is a behavioural
      # gate and not just a second compile. No services: SQLite in a temp file.
      - run: ./scripts/run-examples.sh

  release-surface:
    name: docs / feature matrix / package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # docs.rs renders what this produces, and a broken intra-doc link is
      # invisible until then — so it is a gate, not a warning.
      - name: rustdoc, warnings denied
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # The facade crate's features are its public API: a combination that does
      # not compile is a broken dependency line for whoever wrote it.
      - name: keelson feature matrix
        run: ./scripts/feature-matrix.sh
      # What crates.io would receive, built in isolation from its own tarball.
      # The `--exclude`s are the publish=false members, which
      # `cargo package --workspace` would otherwise package anyway; see
      # docs/publishing.md.
      - name: package the publishable set
        run: >
          cargo package --workspace
          --exclude keelson-sqlcheck
          --exclude keelson-examples
          --exclude keelson-facade-consumer
          --exclude keelson-benches
          --exclude keelson-tokio-postgres
          --allow-dirty

  coverage-gate:
    name: sqlcheck coverage gate (Tier D)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The record path must be absolute: each test binary runs with its own
      # crate directory as cwd (see docs/testing-tiers.md). $GITHUB_WORKSPACE
      # is the checkout root, i.e. the same directory the docs' $PWD refers to.
      - name: Record judged SQL from a full test run
        run: KEELSON_SQLCHECK_RECORD="$GITHUB_WORKSPACE/target/sqlcheck-record" cargo test --workspace
      - name: Replay recording against the construct manifests
        run: cargo run -p keelson-sqlcheck --bin coverage-gate -- target/sqlcheck-record

  supply-chain:
    name: supply chain (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The action ships its own cargo-deny binary, so this needs no toolchain
      # and no build. `check` runs every section deny.toml configures.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  coverage:
    name: line coverage (reported, not gated)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # No engine tier here: this measures the lanes every contributor can run,
      # so the number means the same thing locally as it does in CI.
      - name: Measure
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Summarise into the job log
        run: cargo llvm-cov report --summary-only
      # Kept as an artifact rather than sent to a coverage service: the number
      # is for whoever is reading a pull request, and a third party is a
      # dependency this repo has no reason to take on.
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
          retention-days: 14

  msrv:
    name: MSRV check (Cargo.toml rust-version)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked

  engine:
    name: engine tier (live-docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # This is the job that runs out of room: the whole workspace, plus the
      # live-docker feature's client stack (tokio-postgres, mysql, rusqlite,
      # testcontainers), plus two engine images. When the disk fills, rust-lld
      # dies with SIGBUS mid-link and reports itself as an LLVM crash — so the
      # symptom names the wrong culprit entirely. The runner ships ~25 GB of
      # preinstalled toolchains this repo never touches; deleting them costs
      # seconds. The `df` lines stay so the next capacity problem is one line
      # of log rather than another crash to decode.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Pull the engine images up front so image download time is visible as
      # its own step and the first test doesn't absorb it into its timeout.
      - name: Pull engine images
        run: |
          docker pull postgres:17-alpine
          docker pull mysql:8.4
      # Every crate that gates engine tests on a feature has to be named.
      # `keelson-sqlcheck/live-docker` alone starts the containers and is what
      # the dialect crates ask `live::available()` about at run time — but a
      # crate whose tests are `#[cfg(feature = "live-docker")]` on its *own*
      # feature compiles them out unless that feature is on, and a feature does
      # not propagate from a dependency to its dependents. With only the judge's
      # feature named, keelson-sqlx's nine PostgreSQL/MySQL transaction tests
      # (and keelson-models', keelson-factory's, keelson-gen's) silently did not
      # run. keelson-core is deliberately absent: its own `live-docker` cannot be
      # switched on workspace-wide (see the comment in its manifest), and it
      # needs nothing beyond the judge's.
      - run: >
          cargo test --workspace
          --features keelson-sqlcheck/live-docker,keelson-sqlx/live-docker,keelson-models/live-docker,keelson-factory/live-docker,keelson-gen/live-docker,keelson-tokio-postgres/live-docker
      # testcontainers' reaper normally handles this; sweep anyway so a crashed
      # run can't leak containers into a reused runner environment.
      - name: Clean up testcontainers
        if: always()
        run: |
          ids=$(docker ps -q --filter "label=org.testcontainers.managed-by=testcontainers")
          [ -n "$ids" ] && docker rm -f $ids || true
